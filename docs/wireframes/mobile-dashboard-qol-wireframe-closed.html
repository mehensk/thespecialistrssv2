<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile Dashboard QoL Wireframe - Drawer Closed</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --ink: #111111;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #1f2937;
      --accent-2: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .phone {
      max-width: 430px;
      margin: 24px auto 40px;
      background: var(--bg);
      border: 1px solid #d1d5db;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      position: relative;
    }
    .status-bar {
      height: 18px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--accent);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #111827;
    }
    .topbar .title {
      font-weight: 600;
      font-size: 14px;
    }
    .menu-btn {
      border: 1px solid #374151;
      background: transparent;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .content {
      padding: 12px 12px 18px;
    }

    .section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .upload-box {
      border: 2px dashed #cbd5f5;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      background: #f8fafc;
    }
    .upload-box .primary {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .upload-box .hint {
      font-size: 11px;
      color: var(--muted);
    }

    .thumb-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .thumb {
      background: #e5e7eb;
      border-radius: 10px;
      height: 90px;
      position: relative;
      overflow: hidden;
      border: 1px solid #d1d5db;
    }
    .thumb .badge {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15,23,42,0.85);
      color: #fff;
      font-size: 10px;
      padding: 4px 6px;
      text-align: center;
    }
    .thumb .delete {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .accordion {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
      background: #fff;
    }
    .accordion .header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 12px;
      background: #f9fafb;
    }
    .accordion .body {
      padding: 12px;
      border-top: 1px solid var(--line);
    }

    .field {
      height: 34px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #f8fafc;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      font-size: 12px;
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
    }
    .btn.secondary {
      background: #fff;
      color: var(--accent);
    }

    .note {
      font-size: 11px;
      color: var(--muted);
      margin: 0 12px 14px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar"></div>

    <!-- Sticky mobile header with Menu (Option 1) -->
    <div class="topbar">
      <div class="title">My Dashboard</div>
      <button class="menu-btn">Menu</button>
    </div>

    <div class="content">
      <div class="section">
        <h3>Images (Upload First)</h3>
        <div class="upload-box">
          <span class="primary">Tap to upload photos</span>
          <span class="hint">Recommended: 2000 x 1500px, max 20MB</span>
        </div>
        <div class="thumb-grid">
          <div class="thumb">
            <div class="delete">x</div>
            <div class="badge">Cover</div>
          </div>
          <div class="thumb">
            <div class="delete">x</div>
            <div class="badge">2</div>
          </div>
          <div class="thumb">
            <div class="delete">x</div>
            <div class="badge">3</div>
          </div>
          <div class="thumb">
            <div class="delete">x</div>
            <div class="badge">4</div>
          </div>
        </div>
      </div>

      <div class="accordion">
        <div class="header">
          <span>Basic Information (Open)</span>
          <span>v</span>
        </div>
        <div class="body">
          <div class="field"></div>
          <div class="field"></div>
          <div class="field"></div>
        </div>
      </div>

      <div class="accordion">
        <div class="header">
          <span>Property Details (Collapsed)</span>
          <span>></span>
        </div>
      </div>

      <div class="accordion">
        <div class="header">
          <span>Amenities (Collapsed)</span>
          <span>></span>
        </div>
      </div>

      <div class="section">
        <h3>Actions</h3>
        <div class="actions">
          <button class="btn primary">Create Listing</button>
          <button class="btn secondary">Cancel</button>
        </div>
      </div>
    </div>

    <p class="note">Wireframe: drawer is closed. Top bar stays visible while scrolling.</p>
  </div>
</body>
</html>
