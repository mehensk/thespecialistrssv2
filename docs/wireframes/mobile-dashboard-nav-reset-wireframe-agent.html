<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile Dashboard Nav Reset Wireframe (Agent)</title>
  <style>
    :root {
      --bg: #eef1f5;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #d9dee8;
      --nav: #111827;
      --nav-2: #1f2937;
      --active: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at 20% -10%, #f8fafc 0%, #e9edf3 45%, #dde4ee 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--ink);
    }
    .phone {
      width: min(430px, 100%);
      height: 860px;
      background: var(--bg);
      border: 1px solid #c7d1df;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
      overflow: hidden;
      position: relative;
    }
    .status {
      height: 18px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .top {
      height: 72px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .brand {
      font-weight: 600;
      font-size: 20px;
      color: #1e293b;
    }
    .rolebar {
      height: 64px;
      background: var(--nav-2);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 28px;
      font-weight: 800;
      border-bottom: 1px solid #0b1220;
    }
    .scroll {
      height: calc(100% - 18px - 72px - 64px - 70px);
      overflow-y: auto;
      padding: 16px;
    }
    .heading { margin: 4px 0 8px; font-size: 24px; font-weight: 700; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      min-height: 96px;
    }
    .card .k { color: #475569; font-size: 14px; margin-bottom: 10px; }
    .card .v { font-size: 36px; font-weight: 800; line-height: 1; }

    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background: var(--nav);
      border-top: 1px solid #2b3443;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 20;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab {
      border: 0;
      background: transparent;
      color: #9ca3af;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .tab .dot { width: 18px; height: 18px; border-radius: 6px; background: #374151; }
    .tab.active { color: #fff; }
    .tab.active .dot { background: var(--active); }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.45);
      z-index: 30;
      display: none;
    }
    .overlay.open { display: block; }
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 70px;
      max-height: 60%;
      background: #fff;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-top: 1px solid var(--line);
      box-shadow: 0 -14px 30px rgba(15, 23, 42, 0.25);
      transform: translateY(110%);
      transition: transform 0.24s ease;
      overflow: auto;
    }
    .overlay.open .sheet { transform: translateY(0); }
    .grab { width: 42px; height: 4px; border-radius: 99px; background: #cbd5e1; margin: 10px auto 8px; }
    .sheet h3 { margin: 0; padding: 0 16px 10px; font-size: 13px; color: #334155; text-transform: uppercase; letter-spacing: 1px; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-top: 1px solid #edf2f7; font-size: 15px; }
    .item .mini { width: 14px; height: 14px; background: #e2e8f0; border-radius: 4px; margin-right: 10px; display: inline-block; }
    .item .left { display: inline-flex; align-items: center; color: #0f172a; font-weight: 500; }
    .item.logout .left { color: #b91c1c; }

    .legend {
      position: absolute;
      right: 10px;
      top: 10px;
      background: rgba(255,255,255,0.88);
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      color: #475569;
      z-index: 40;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="legend">Agent variant: fewer More items</div>
    <div class="status"></div>
    <header class="top"><div class="brand">The Specialist Realty</div></header>
    <div class="rolebar">My Dashboard</div>

    <main class="scroll">
      <h1 class="heading">Welcome Back</h1>
      <p class="sub">Manage listings and activity from mobile quickly.</p>
      <div class="card"><div class="k">My Listings</div><div class="v">14</div></div>
      <div class="card"><div class="k">My Blogs</div><div class="v">2</div></div>
      <div class="card"><div class="k">Pending Tasks</div><div class="v">3</div></div>
      <div class="card"><div class="k">Last Activity</div><div class="v" style="font-size:20px;">2h ago</div></div>
    </main>

    <nav class="tabbar">
      <button class="tab active"><span class="dot"></span><span>Home</span></button>
      <button class="tab"><span class="dot"></span><span>Listings</span></button>
      <button class="tab"><span class="dot"></span><span>Blogs</span></button>
      <button class="tab"><span class="dot"></span><span>Activity</span></button>
      <button id="moreBtn" class="tab"><span class="dot"></span><span>More</span></button>
    </nav>

    <div id="overlay" class="overlay">
      <section class="sheet" role="dialog" aria-label="More navigation">
        <div class="grab"></div>
        <h3>More Navigation</h3>
        <div class="item"><span class="left"><span class="mini"></span>Settings</span><span>›</span></div>
        <div class="item"><span class="left"><span class="mini"></span>Profile</span><span>›</span></div>
        <div class="item logout"><span class="left"><span class="mini"></span>Logout</span><span>›</span></div>
      </section>
    </div>
  </div>

  <script>
    const moreBtn = document.getElementById('moreBtn');
    const overlay = document.getElementById('overlay');
    moreBtn.addEventListener('click', () => overlay.classList.toggle('open'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
  </script>
</body>
</html>
